<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Bone Reconstruction Prototype</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
      }
      #info {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        color: white;
        font-family: sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <h1>High-Precision 3D Bone Reconstructor (Prototype)</h1>
      <p>Left Click: Rotate | Right Click: Pan | Scroll: Zoom</p>
    </div>

    <script type="module">
      import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
      import { OBJLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/OBJLoader.js";
      import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

      // 1. Scene Setup
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x222222); // Dark grey background

      // 2. Camera
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(50, 50, 50);
      camera.lookAt(0, 0, 0);

      // 3. Renderer
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // 4. Controls
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // 5. Lighting
      const ambientLight = new THREE.AmbientLight(0x606060);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
      directionalLight.position.set(10, 20, 10);
      scene.add(directionalLight);

      const backLight = new THREE.DirectionalLight(0xffffff, 0.8);
      backLight.position.set(-10, -10, -10);
      scene.add(backLight);

      // Helpers
      const axesHelper = new THREE.AxesHelper(50);
      scene.add(axesHelper);

      const gridHelper = new THREE.GridHelper(100, 10);
      scene.add(gridHelper);

      // 6. Load the Model
      const loader = new OBJLoader();
      loader.load(
        "data/reconstructed_bone.obj",
        function (object) {
          console.log("✅ Object loaded", object);
          object.traverse(function (child) {
            if (child.isMesh) {
              child.material = new THREE.MeshStandardMaterial({
                color: 0xe5e5e5,
                roughness: 0.6,
                metalness: 0.1,
                side: THREE.DoubleSide,
              });
              child.geometry.computeVertexNormals();
            }
          });

          // Auto-center and scale
          const box = new THREE.Box3().setFromObject(object);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());

          const maxDim = Math.max(size.x, size.y, size.z);
          const scale = 50 / maxDim;
          object.scale.set(scale, scale, scale);

          object.position.x = -center.x * scale;
          object.position.y = -center.y * scale;
          object.position.z = -center.z * scale;

          scene.add(object);
          console.log("✅ Model added to scene");
        },
        function (xhr) {
          console.log((xhr.loaded / xhr.total) * 100 + "% loaded");
        },
        function (error) {
          console.error("❌ An error happened", error);
          alert("Error loading model: " + error.message);
        }
      );

      // 7. Animation Loop
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      // Handle Resize
      window.addEventListener("resize", onWindowResize, false);
      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    </script>
  </body>
</html>
